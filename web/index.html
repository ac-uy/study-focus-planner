<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Study Focus Planner</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #fbf4f6; color: #3f3550; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; line-height: 1.4; }
  main { max-width: 1000px; margin: 0 auto; padding: 24px 16px 48px; }
  h1, h2, h3 { color: #4b3d66; margin: 0; }
  h1 { font-size: 28px; }
  h2 { font-size: 18px; margin-bottom: 12px; }
  .muted { color: #6f6282; font-size: 14px; }
  header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 20px; }
  .err { color: #b0475e; font-size: 14px; margin-top: 4px; }
  .lang { display: flex; gap: 6px; }
  .pill { border: 1px solid #e6dcf2; background: #fff; color: #4b3d66; border-radius: 999px; padding: 6px 14px; cursor: pointer; font: inherit; font-size: 14px; }
  .pill.active { background: #7a5cc4; color: #fff; border-color: #7a5cc4; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
  @media (max-width: 720px) { .row { grid-template-columns: 1fr; } }
  .panel { background: #fff; border: 1px solid #e6dcf2; border-radius: 20px; padding: 20px; margin-bottom: 16px; }
  .row .panel { margin-bottom: 0; }
  .timer { text-align: center; }
  .clock { font-size: 64px; font-weight: 700; color: #4b3d66; font-variant-numeric: tabular-nums; }
  .bar { height: 6px; background: #efe8f8; border-radius: 999px; overflow: hidden; margin: 12px 0 16px; }
  .bar > div { height: 100%; background: #a58be0; border-radius: 999px; transition: width .3s; }
  button.primary { background: #7a5cc4; color: #fff; border: 0; border-radius: 999px; padding: 10px 20px; font: inherit; cursor: pointer; }
  button.primary:hover { background: #6a4db3; }
  button.secondary { background: #fff; color: #4b3d66; border: 1px solid #e6dcf2; border-radius: 999px; padding: 10px 20px; font: inherit; cursor: pointer; }
  button.link { background: none; border: 0; color: #b0475e; cursor: pointer; font: inherit; font-size: 13px; padding: 0; }
  button.link:hover { text-decoration: underline; }
  input[type=text], input[type=date], input[type=number], select { border: 1px solid #e6dcf2; border-radius: 12px; padding: 8px 10px; font: inherit; color: #3f3550; background: #fff; min-width: 0; }
  .form { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  .form input[type=text] { flex: 1 1 140px; }
  ul { list-style: none; padding: 0; margin: 0; }
  li.task { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid #f1ebf8; }
  li.task:first-child { border-top: 0; }
  li.task .body { flex: 1; min-width: 0; }
  li.task .title { word-break: break-word; }
  li.done { opacity: .55; }
  li.done .title { text-decoration: line-through; }
  .chart { display: flex; align-items: flex-end; justify-content: space-between; gap: 8px; height: 150px; }
  .col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; }
  .col .n { font-size: 13px; color: #6f6282; margin-bottom: 4px; }
  .col .b { width: 100%; max-width: 48px; background: #a58be0; border-radius: 8px 8px 4px 4px; }
  .col .b.zero { opacity: .25; }
  .col .d { font-size: 12px; color: #6f6282; margin-top: 6px; }
  .goal { border: 1px solid #e6dcf2; border-radius: 16px; padding: 14px; margin-top: 12px; }
  .goal .head { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; }
  .goal .step { display: flex; align-items: center; gap: 8px; padding: 4px 0; }
  .goal .step span { flex: 1; word-break: break-word; }
  .goal .step.done span { text-decoration: line-through; opacity: .6; }
  .goal .bar { margin: 8px 0 10px; }
  details summary { cursor: pointer; font-size: 18px; font-weight: 600; color: #4b3d66; }
  details[open] summary { margin-bottom: 12px; }
  .field { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .field input[type=number] { width: 90px; }
  .chip { display: inline-flex; align-items: center; gap: 8px; background: #f4eefb; border-radius: 999px; padding: 4px 12px; margin: 0 6px 6px 0; }
  .chip button { background: none; border: 0; color: #b0475e; cursor: pointer; font-size: 16px; padding: 0; line-height: 1; }
  body { min-height: 100vh; }
  [hidden] { display: none !important; }
  dialog { border: 1px solid #e6dcf2; border-radius: 20px; padding: 20px; width: min(680px, 94vw); max-height: 90vh; color: #3f3550; background: #fff; }
  dialog::backdrop { background: rgba(63, 53, 80, .45); }
  .dlg-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .dlg-head button { font-size: 14px; }
  .preview { max-width: 100%; max-height: 220px; border-radius: 12px; border: 1px solid #e6dcf2; margin: 10px 0; display: block; }
  .rv h3 { font-size: 15px; margin: 14px 0 6px; }
  .rv ul { list-style: disc; padding-left: 20px; }
  .rv li { margin-bottom: 4px; }
  .q { border: 1px solid #e6dcf2; border-radius: 14px; padding: 12px; margin-top: 10px; }
  .q label { display: block; padding: 4px 6px; border-radius: 8px; cursor: pointer; }
  .q label.ok { background: #e3f5e9; }
  .q label.bad { background: #fbe9ee; }
  .q .why { font-size: 13px; color: #6f6282; margin-top: 6px; }
  a.chk, button.chk { background: none; border: 0; color: #7a5cc4; cursor: pointer; font: inherit; font-size: 13px; padding: 0; }
  button.chk:hover { text-decoration: underline; }
  .chat-log { max-height: 340px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding: 4px 2px 8px; }
  .msg { max-width: 85%; padding: 8px 12px; border-radius: 16px; word-break: break-word; }
  .msg.bot { background: #f4eefb; align-self: flex-start; border-bottom-left-radius: 4px; }
  .msg.me { background: #7a5cc4; color: #fff; align-self: flex-end; border-bottom-right-radius: 4px; }
  .msg.errmsg { background: #fbe9ee; color: #b0475e; align-self: flex-start; }
  .thumbs { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .thumb { position: relative; }
  .thumb img { width: 64px; height: 64px; object-fit: cover; border-radius: 10px; border: 1px solid #e6dcf2; display: block; }
  .thumb button { position: absolute; top: -6px; right: -6px; width: 20px; height: 20px; border-radius: 50%; border: 0; background: #b0475e; color: #fff; cursor: pointer; line-height: 1; padding: 0; font-size: 13px; }
  .msg img { max-width: 120px; max-height: 120px; border-radius: 8px; margin: 0 4px 4px 0; display: inline-block; vertical-align: top; }
  body.dark-bg h1 { color: #fff; }
  body.dark-bg header .muted { color: #d9d0ea; }
  body.dark-bg header .err { color: #ffb3c4; }
  .sound { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px; margin-top: 16px; }
  .sound input[type=range] { width: 110px; accent-color: #7a5cc4; }
  .swatches { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 8px; }
  .swatch { width: 34px; height: 34px; border-radius: 50%; border: 2px solid #e6dcf2; cursor: pointer; padding: 0; }
  .swatch.active { border: 3px solid #7a5cc4; }
  input[type=color] { width: 40px; height: 34px; border: 1px solid #e6dcf2; border-radius: 10px; padding: 2px; background: #fff; cursor: pointer; }
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1 id="title"></h1>
      <div class="muted" id="subtitle"></div>
      <div class="err" id="storageError"></div>
    </div>
    <div class="lang">
      <button class="pill" id="langEn">EN</button>
      <button class="pill" id="langEs">ES</button>
      <button class="pill" id="signOutBtn" hidden></button>
    </div>
  </header>

  <div id="home">
  <div class="row">
    <section class="panel timer">
      <h2 id="timerHeading"></h2>
      <div class="clock" id="clock">25:00</div>
      <div class="muted" id="modeLabel"></div>
      <div class="bar"><div id="timerBar" style="width:0%"></div></div>
      <button class="primary" id="startBtn"></button>
      <button class="secondary" id="resetBtn"></button>
      <div class="sound">
        <select id="soundSelect"></select>
        <button class="secondary" id="previewBtn" style="padding:8px 14px"></button>
        <input type="range" id="volume" min="0" max="100" step="1">
      </div>
    </section>

    <section class="panel">
      <h2 id="tasksHeading"></h2>
      <div class="form">
        <select id="taskSubject"></select>
        <select id="taskGoal"></select>
        <input type="text" id="taskTitle" maxlength="200">
        <input type="date" id="taskDue">
        <button class="primary" id="addTaskBtn"></button>
      </div>
      <ul id="taskList"></ul>
    </section>
  </div>

  <section class="panel">
    <h2 id="chartHeading"></h2>
    <div class="chart" id="chart"></div>
    <div class="muted" id="chartSummary" style="margin-top:10px"></div>
  </section>

  <section class="panel">
    <h2 id="goalsHeading"></h2>
    <div class="form">
      <input type="text" id="goalTitle" maxlength="200">
      <input type="date" id="goalDue">
      <button class="primary" id="addGoalBtn"></button>
    </div>
    <div id="goalList"></div>
  </section>

  <section class="panel" id="chatPanel" hidden>
    <h2 id="chatHeading"></h2>
    <div class="chat-log" id="chatLog" aria-live="polite"></div>
    <div class="thumbs" id="chatPending" hidden></div>
    <div class="form" style="margin:10px 0 0">
      <select id="chatSubject"></select>
      <button class="secondary" id="chatAttach" type="button" style="padding:8px 12px">📎</button>
      <input type="file" id="chatFile" accept="image/*" multiple hidden>
      <input type="text" id="chatInput" maxlength="1500">
      <button class="primary" id="chatSend"></button>
      <button class="secondary" id="chatNew"></button>
    </div>
  </section>

  <section class="panel">
    <details>
      <summary id="settingsHeading"></summary>
      <div class="field"><label for="focusMin" id="focusLabel"></label><input type="number" id="focusMin" min="1" max="120"></div>
      <div class="field"><label for="breakMin" id="breakLabel"></label><input type="number" id="breakMin" min="1" max="60"></div>
      <div class="field"><label for="levelSelect" id="levelLabel"></label><select id="levelSelect"></select></div>
      <h3 id="subjectsHeading" style="font-size:15px;margin:14px 0 8px"></h3>
      <div id="subjectList"></div>
      <div class="form">
        <input type="text" id="newSubject" maxlength="40">
        <button class="secondary" id="addSubjectBtn"></button>
      </div>
      <div class="err" id="subjectError"></div>
      <h3 id="bgHeading" style="font-size:15px;margin:18px 0 8px"></h3>
      <div class="swatches" id="bgSwatches"></div>
      <div class="field"><label for="bgColor" id="bgCustomLabel"></label><input type="color" id="bgColor" value="#fbf4f6"></div>
    </details>
  </section>
  </div>

  <section class="panel" id="taskView" hidden>
  <div class="dlg-head"><button class="pill" id="ckClose"></button></div>
  <h2 id="ckTitle" style="margin:0 0 6px"></h2>
  <div class="muted" id="tvMeta"></div>
  <div class="form" style="margin:12px 0 0">
    <input type="text" id="tvTitle" maxlength="200">
    <select id="tvSubject"></select>
    <input type="date" id="tvDue">
  </div>
  <div class="field" style="margin-top:12px"><label><input type="checkbox" id="tvDone"> <span id="tvDoneLabel"></span></label></div>
  <div class="field"><label for="tvGoal" id="tvGoalLabel"></label><select id="tvGoal"></select></div>
  <div id="ckTools">
  <div class="muted" id="ckHint"></div>
  <div class="form" style="margin:10px 0 0">
    <button class="secondary" id="ckTake"></button>
    <button class="secondary" id="ckChoose"></button>
    <button class="primary" id="ckRun" disabled></button>
  </div>
  <input type="file" id="ckFileTake" accept="image/*" capture="environment" hidden>
  <input type="file" id="ckFileChoose" accept="image/*" hidden>
  <img class="preview" id="ckPreview" alt="" hidden>
  <div id="ckDyn"></div>
  </div>
  </section>
</main>

  }
  function bgIsDark(v) {
    if (/^#/.test(v)) {
      var r = parseInt(v.slice(1, 3), 16), g = parseInt(v.slice(3, 5), 16), b = parseInt(v.slice(5, 7), 16);
      return (0.299 * r + 0.587 * g + 0.114 * b) < 128;
    }
    return !!BACKGROUNDS.filter(function (b) { return b.id === v; })[0].dark;
  }
  function applyBackground() {
    var v = state.settings.bg;
    document.body.style.background = bgCss(v);
    document.body.style.backgroundAttachment = 'fixed';
    document.body.classList.toggle('dark-bg', bgIsDark(v));
  }
  function renderBackground() {
    var names = t('bgNames'), cur = state.settings.bg;
    $('bgSwatches').innerHTML = BACKGROUNDS.map(function (b) {
      return '<button class="swatch' + (cur === b.id ? ' active' : '') + '" data-bg="' + b.id + '" style="background:' + b.css + '" title="' + esc(names[b.id]) + '" aria-label="' + esc(names[b.id]) + '"></button>';
    }).join('');
    if (/^#/.test(cur)) $('bgColor').value = cur;
    applyBackground();
  }
  function renderSubjectSelect() {
    var sel = $('taskSubject'), cur = sel.value;
    sel.innerHTML = state.settings.subjects.map(function (n) {
      return '<option value="' + esc(n) + '">' + esc(subjectName(n)) + '</option>';
    }).join('');
    sel.value = state.settings.subjects.indexOf(cur) >= 0 ? cur : state.settings.subjects[0];
  }
  function goalById(id) { return id ? state.goals.filter(function (g) { return g.id === id; })[0] : undefined; }
  function renderGoalSelect() {
    var opts = '<option value="">' + esc(t('noGoal')) + '</option>' + state.goals.map(function (g) {
      return '<option value="' + esc(g.id) + '">' + esc(g.title) + '</option>';
    }).join('');
    var sel = $('taskGoal'), cur = sel.value;
    sel.innerHTML = opts;
    sel.value = goalById(cur) ? cur : '';
    sel.title = t('taskGoal');
  }
  function taskMeta(x) {
    var g = goalById(x.goalId);
    return subjectName(x.subject) + ' · ' + x.due + (g ? ' · 🎯 ' + g.title : '');
  }
  function renderTasks() {
    var list = state.tasks.slice().sort(function (a, b) {
      if (a.done !== b.done) return a.done ? 1 : -1;
      return a.due < b.due ? -1 : a.due > b.due ? 1 : 0;
    });
    if (!list.length) { $('taskList').innerHTML = '<li class="muted">' + esc(t('noTasks')) + '</li>'; return; }
    $('taskList').innerHTML = list.map(function (x) {
      return '<li class="task' + (x.done ? ' done' : '') + '">' +
        '<input type="checkbox" data-task-toggle="' + esc(x.id) + '"' + (x.done ? ' checked' : '') + '>' +
        '<div class="body"><div class="title">' + esc(x.title) + '</div>' +
        '<div class="muted">' + esc(taskMeta(x)) + '</div></div>' +
        '<button class="chk" data-task-open="' + esc(x.id) + '">' + esc(t('openTask')) + '</button>' +
        '<button class="link" data-task-del="' + esc(x.id) + '">' + esc(t('del')) + '</button></li>';
    }).join('');
  }
  function renderChart() {
    var today = todayKey(), days = [], max = 1, total = 0, i;
    for (i = 6; i >= 0; i--) {
      var k = addDays(today, -i), p = k.split('-');
      var n = state.sessions[k] || 0;
      days.push({ n: n, label: t('days')[new Date(+p[0], +p[1] - 1, +p[2]).getDay()] });
      total += n; if (n > max) max = n;
    }
    $('chart').innerHTML = days.map(function (d) {
      var h = d.n ? Math.max(8, Math.round(d.n / max * 100)) : 8;
      return '<div class="col"><div class="n">' + d.n + '</div><div class="b' + (d.n ? '' : ' zero') + '" style="height:' + h + 'px"></div><div class="d">' + esc(d.label) + '</div></div>';
    }).join('');
    $('chartSummary').textContent = t('weekTotal', { n: total });
  }
  function countdown(due) {
    if (!due) return '';
    var d = dayDiff(todayKey(), due);
    var txt = d === 0 ? t('today') : d === 1 ? t('tomorrow') : d > 1 ? t('daysLeft', { n: d }) : (d === -1 ? t('finishedAgo1') : t('finishedAgo', { n: -d }));
    return due + ' · ' + txt;
  }
  function renderGoals() {
    if (!state.goals.length) { $('goalList').innerHTML = '<div class="muted">' + esc(t('noGoals')) + '</div>'; return; }
    $('goalList').innerHTML = state.goals.map(function (g) {
      var done = g.steps.filter(function (s) { return s.done; }).length, total = g.steps.length;
      var gTasks = state.tasks.filter(function (x) { return x.goalId === g.id; });
      var tDone = gTasks.filter(function (x) { return x.done; }).length;
      var pct = (total + gTasks.length) ? Math.round((done + tDone) / (total + gTasks.length) * 100) : 0;
      var meta = [countdown(g.due), t('stepsDone', { done: done, total: total }), gTasks.length ? t('tasksDone', { done: tDone, total: gTasks.length }) : ''].filter(Boolean).join(' · ');
      return '<div class="goal" data-goal="' + esc(g.id) + '">' +
        '<div class="head"><div><h3>' + esc(g.title) + '</h3><div class="muted">' + esc(meta) + '</div></div>' +
        '<button class="link" data-goal-del="' + esc(g.id) + '">' + esc(t('delGoal')) + '</button></div>' +
        '<div class="bar"><div style="width:' + pct + '%"></div></div>' +
        g.steps.map(function (s) {
          return '<div class="step' + (s.done ? ' done' : '') + '"><input type="checkbox" data-step-toggle="' + esc(s.id) + '"' + (s.done ? ' checked' : '') + '><span>' + esc(s.title) + '</span>' +
            '<button class="link" data-step-del="' + esc(s.id) + '">' + esc(t('remove')) + '</button></div>';
        }).join('') +
        '<div class="form" style="margin:8px 0 0"><input type="text" maxlength="200" data-step-input placeholder="' + esc(t('stepPlaceholder')) + '">' +
        '<button class="secondary" data-step-add="' + esc(g.id) + '">' + esc(t('addStep')) + '</button>' +
        (cloud ? '<button class="secondary" data-ai="' + esc(g.id) + '">✨ ' + esc(t('suggest')) + '</button>' : '') +
        '</div>' +
        '<h3 style="font-size:14px;margin:14px 0 4px">' + esc(t('gTasks')) + '</h3>' +
        gTasks.map(function (x) {
          return '<div class="step' + (x.done ? ' done' : '') + '"><input type="checkbox" data-gtask-toggle="' + esc(x.id) + '"' + (x.done ? ' checked' : '') + '>' +
            '<span>' + esc(x.title) + ' <span class="muted">· ' + esc(x.due) + '</span></span>' +
            '<button class="chk" data-task-open="' + esc(x.id) + '">' + esc(t('openTask')) + '</button>' +
            '<button class="link" data-gtask-unlink="' + esc(x.id) + '">' + esc(t('unlink')) + '</button></div>';
        }).join('') +
        '<div class="form" style="margin:8px 0 0"><input type="text" maxlength="200" data-gtask-input placeholder="' + esc(t('gTaskPlaceholder')) + '">' +
        '<button class="secondary" data-gtask-add="' + esc(g.id) + '">' + esc(t('addGoalTask')) + '</button></div></div>';
    }).join('');
  }
  function renderSubjects() {
    $('subjectList').innerHTML = state.settings.subjects.map(function (n, i) {
      return '<span class="chip">' + esc(subjectName(n)) + '<button data-subj-del="' + i + '" aria-label="' + esc(t('remove')) + '">×</button></span>';
    }).join('');
  }
  function renderStatic() {
    document.documentElement.lang = state.lang;
    $('title').textContent = t('title');
    $('timerHeading').textContent = t('timer');
    $('tasksHeading').textContent = t('tasks');
    $('taskTitle').placeholder = t('taskPlaceholder');
    $('addTaskBtn').textContent = t('addTask');
    $('resetBtn').textContent = t('reset');
    $('chartHeading').textContent = t('chart');
    $('goalsHeading').textContent = t('goals');
    $('goalTitle').placeholder = t('goalPlaceholder');
    $('addGoalBtn').textContent = t('addGoal');
    $('settingsHeading').textContent = t('settings');
    $('focusLabel').textContent = t('focusLen');
    $('breakLabel').textContent = t('breakLen');
    $('subjectsHeading').textContent = t('subjects');
    $('newSubject').placeholder = t('subjectPlaceholder');
    $('addSubjectBtn').textContent = t('addSubject');
    $('signOutBtn').textContent = t('signOut');
    $('levelLabel').textContent = t('level');
    $('levelSelect').innerHTML = '<option value="">' + esc(t('levelNone')) + '</option>' + LEVELS.map(function (l) {
      return '<option value="' + l.id + '">' + esc(l.label) + '</option>';
    }).join('');
    $('levelSelect').value = state.settings.level;
    $('bgHeading').textContent = t('background');
    $('bgCustomLabel').textContent = t('bgCustom');
    $('langEn').classList.toggle('active', state.lang === 'en');
    $('langEs').classList.toggle('active', state.lang === 'es');
  }
  function renderAll() {
    renderStatic(); renderError(); renderSubtitle(); renderTimer();
    renderSubjectSelect(); renderGoalSelect(); renderTasks(); renderChart(); renderGoals(); renderSubjects();
    renderSound(); renderBackground(); renderChatStatic();
    if (ck && !$('taskView').hidden) { if (ckTask()) refreshTaskView(); else hideTaskView(); }
  }

  // ---------- actions ----------
  function addTask() {
    var title = $('taskTitle').value.trim();
    if (!title) return;
    state.tasks.push({ id: uid(), title: title, subject: $('taskSubject').value, due: $('taskDue').value || todayKey(), done: false, notes: '', goalId: $('taskGoal').value || '' });
    $('taskTitle').value = '';
    save(); renderTasks(); renderGoals(); renderSubtitle();
  }
  function addGoalTask(goalEl) {
    var input = goalEl.querySelector('[data-gtask-input]'), title = input.value.trim();
    if (!title) return;
    var gid = goalEl.getAttribute('data-goal');
    if (!goalById(gid)) return;
    state.tasks.push({ id: uid(), title: title, subject: state.settings.subjects[0], due: todayKey(), done: false, notes: '', goalId: gid });
    save(); renderGoals(); renderTasks(); renderSubtitle();
  }
  function addGoal() {
    var title = $('goalTitle').value.trim();
    if (!title) return;
    state.goals.push({ id: uid(), title: title, due: $('goalDue').value || '', steps: [] });
    $('goalTitle').value = ''; $('goalDue').value = '';
    save(); renderGoals(); renderGoalSelect();
  }
  function addStep(goalEl) {
    var input = goalEl.querySelector('[data-step-input]'), title = input.value.trim();
    if (!title) return;
    var g = state.goals.filter(function (x) { return x.id === goalEl.getAttribute('data-goal'); })[0];
    if (!g) return;
    g.steps.push({ id: uid(), title: title, done: false });
    save(); renderGoals();
  }
  function addSubject() {
    var name = $('newSubject').value.trim(), err = '';
    if (!name) return;
    var subs = state.settings.subjects;
    if (subs.some(function (x) { return x.toLowerCase() === name.toLowerCase() || subjectName(x).toLowerCase() === name.toLowerCase(); })) err = t('errDup');
    else if (subs.length >= MAX_SUBJECTS) err = t('errMax', { n: MAX_SUBJECTS });
    $('subjectError').textContent = err;
    if (err) return;
    subs.push(name);
    $('newSubject').value = '';
    save(); renderSubjects(); renderSubjectSelect();
  }
  function settingsChanged() {
    state.settings.focusMin = clamp($('focusMin').value, 1, 120);
    state.settings.breakMin = clamp($('breakMin').value, 1, 60);
    $('focusMin').value = state.settings.focusMin;
    $('breakMin').value = state.settings.breakMin;
    save(); resetTimer();
  }

  function onEnter(el, fn) { el.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); fn(e); } }); }

  function init() {
    state = load();
    $('taskDue').value = todayKey();
    $('focusMin').value = state.settings.focusMin;
    $('breakMin').value = state.settings.breakMin;
    timer.remaining = modeSeconds('focus');

    $('langEn').onclick = function () { state.lang = 'en'; save(); renderAll(); };
    $('langEs').onclick = function () { state.lang = 'es'; save(); renderAll(); };
    $('startBtn').onclick = toggleTimer;
    $('resetBtn').onclick = resetTimer;
    $('addTaskBtn').onclick = addTask;
    onEnter($('taskTitle'), addTask);
    $('addGoalBtn').onclick = addGoal;
    onEnter($('goalTitle'), addGoal);
    $('addSubjectBtn').onclick = addSubject;
    onEnter($('newSubject'), addSubject);
    $('focusMin').onchange = settingsChanged;
    $('breakMin').onchange = settingsChanged;

    $('taskList').addEventListener('change', function (e) {
      var id = e.target.getAttribute('data-task-toggle');
      if (!id) return;
      state.tasks.forEach(function (x) { if (x.id === id) x.done = e.target.checked; });
      save(); renderTasks(); renderGoals(); renderSubtitle();
    });
    $('taskList').addEventListener('click', function (e) {
      var oid = e.target.getAttribute('data-task-open');
      if (oid) { openCheck(oid); return; }
      var id = e.target.getAttribute('data-task-del');
      if (!id) return;
      state.tasks = state.tasks.filter(function (x) { return x.id !== id; });
      save(); renderTasks(); renderGoals(); renderSubtitle();
    });

    $('goalList').addEventListener('change', function (e) {
      var tid = e.target.getAttribute('data-gtask-toggle');
      if (tid) {
        state.tasks.forEach(function (x) { if (x.id === tid) x.done = e.target.checked; });
        save(); renderGoals(); renderTasks(); renderSubtitle();
        return;
      }
      var id = e.target.getAttribute('data-step-toggle');
      if (!id) return;
      state.goals.forEach(function (g) { g.steps.forEach(function (s) { if (s.id === id) s.done = e.target.checked; }); });
      save(); renderGoals();
    });
    $('goalList').addEventListener('click', function (e) {
      var gid = e.target.getAttribute('data-goal-del'), sid = e.target.getAttribute('data-step-del'), aid = e.target.getAttribute('data-step-add');
      var oid = e.target.getAttribute('data-task-open'), uid2 = e.target.getAttribute('data-gtask-unlink'), tadd = e.target.getAttribute('data-gtask-add');
      if (oid) { openCheck(oid); return; }
      if (uid2) { state.tasks.forEach(function (x) { if (x.id === uid2) x.goalId = ''; }); save(); renderGoals(); renderTasks(); return; }
      if (tadd) { addGoalTask(e.target.closest('.goal')); return; }
      if (gid) {
        state.goals = state.goals.filter(function (g) { return g.id !== gid; });
        state.tasks.forEach(function (x) { if (x.goalId === gid) x.goalId = ''; });
        save(); renderGoals(); renderGoalSelect(); renderTasks();
      }
      else if (sid) { state.goals.forEach(function (g) { g.steps = g.steps.filter(function (s) { return s.id !== sid; }); }); save(); renderGoals(); }
      else if (aid) { addStep(e.target.closest('.goal')); }
      else if (e.target.getAttribute('data-ai')) { suggestSteps(e.target.getAttribute('data-ai'), e.target); }
    });
    $('goalList').addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && e.target.hasAttribute('data-step-input')) { e.preventDefault(); addStep(e.target.closest('.goal')); }
      if (e.key === 'Enter' && e.target.hasAttribute('data-gtask-input')) { e.preventDefault(); addGoalTask(e.target.closest('.goal')); }
    });

    $('subjectList').addEventListener('click', function (e) {
      var i = e.target.getAttribute('data-subj-del');
      if (i === null) return;
      if (state.settings.subjects.length <= 1) { $('subjectError').textContent = t('errLast'); return; }
      $('subjectError').textContent = '';
      state.settings.subjects.splice(+i, 1);
      save(); renderSubjects(); renderSubjectSelect();
    });

    $('signOutBtn').onclick = function () { if (cloud) signOut(); };
    $('ckClose').onclick = closeTask;
    window.addEventListener('popstate', function () {
      if (location.hash.indexOf('#task/') === 0) openCheck(decodeURIComponent(location.hash.slice(6)), true);
      else hideTaskView();
    });
    if (location.hash) history.replaceState(null, '', location.pathname + location.search);
    function taskEdited() { save(); refreshTaskView(); renderTasks(); renderGoals(); }
    $('tvTitle').onchange = function () {
      var task = ck && ckTask(); if (!task) return;
      var v = $('tvTitle').value.trim();
      if (!v) { $('tvTitle').value = task.title; return; }
      task.title = v; taskEdited();
    };
    $('tvSubject').onchange = function () { var task = ck && ckTask(); if (!task) return; task.subject = $('tvSubject').value; taskEdited(); };
    $('tvDue').onchange = function () {
      var task = ck && ckTask(); if (!task) return;
      if (!$('tvDue').value) { $('tvDue').value = task.due; return; }
      task.due = $('tvDue').value; taskEdited();
    };
    $('tvDone').onchange = function () {
      var task = ck && ckTask(); if (!task) return;
      task.done = $('tvDone').checked; save(); renderTasks(); renderGoals(); renderSubtitle();
    };
    $('tvGoal').onchange = function () {
      var task = ck && ckTask(); if (!task) return;
      task.goalId = $('tvGoal').value; save(); $('tvMeta').textContent = taskMeta(task); renderTasks(); renderGoals();
    };
    $('ckTake').onclick = function () { $('ckFileTake').click(); };
    $('ckChoose').onclick = function () { $('ckFileChoose').click(); };
    $('ckFileTake').onchange = onCheckFile;
    $('ckFileChoose').onchange = onCheckFile;
    $('ckRun').onclick = runReview;
    $('ckDyn').addEventListener('click', function (e) {
      if (e.target.id === 'ckExamBtn') runExam();
      else if (e.target.id === 'ckDiscuss') discussWithTutor();
      else if (e.target.id === 'ckSubmit') { ck.submitted = true; renderCheck(); }
    });
    $('ckDyn').addEventListener('change', function (e) {
      var q = e.target.getAttribute('data-q');
      if (q !== null) ck.answers[+q] = +e.target.getAttribute('data-o');
    });
    $('levelSelect').onchange = function () { state.settings.level = $('levelSelect').value; save(); };
    $('chatSend').onclick = sendChat;
    onEnter($('chatInput'), sendChat);
    $('chatNew').onclick = function () { chat.msgs = []; chat.error = ''; chat.context = ''; chat.about = ''; chat.pending = []; renderChat(); };
    $('chatAttach').onclick = function () { $('chatFile').click(); };
    $('chatFile').onchange = function () { var files = $('chatFile').files; addChatFiles(files).then(function () { $('chatFile').value = ''; }); };
    $('chatPending').addEventListener('click', function (e) {
      var i = e.target.getAttribute('data-pend-del');
      if (i === null) return;
      chat.pending.splice(+i, 1); renderChat();
    });

    $('soundSelect').onchange = function () { state.settings.sound = $('soundSelect').value; save(); syncAudio(); };
    $('volume').oninput = function () { state.settings.volume = clamp($('volume').value, 0, 100); if (Sound.playing()) Sound.setVolume(state.settings.volume); };
    $('volume').onchange = function () { save(); };
    $('previewBtn').onclick = function () { previewing = !previewing; renderSound(); syncAudio(); };
    $('bgSwatches').addEventListener('click', function (e) {
      var id = e.target.getAttribute('data-bg');
      if (!id) return;
      state.settings.bg = id; save(); renderBackground();
    });
    $('bgColor').oninput = function () { state.settings.bg = $('bgColor').value; renderBackground(); };
    $('bgColor').onchange = function () { save(); };

    renderAll();
    if (loadError) renderError();
    if (location.protocol !== 'file:') startCloud();
  }

  init();
})();
</script>
</body>
</html>
